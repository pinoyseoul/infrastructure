name: Build and Publish OpenScience Dataverse

on:
  push:
    branches:
      - main
    paths:
      - 'containers/dataverse/**'
      - '.github/workflows/build-openscience-dataverse.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: subtleazn
          password: ${{ secrets.ORG_MIRROR_TOKEN }}

      - name: Build and Push OpenScience Dataverse Image
        uses: docker/build-push-action@v5
        with:
          context: ./containers/dataverse
          file: ./containers/dataverse/Dockerfile
          push: true
          tags: |
            ghcr.io/pinoyseoul/dataverse:latest
            ghcr.io/pinoyseoul/dataverse:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
