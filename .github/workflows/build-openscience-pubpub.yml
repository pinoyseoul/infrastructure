name: Build and Publish OpenScience PubPub

on:
  push:
    branches:
      - main
    paths:
      - 'containers/pubpub/**'
      - '.github/workflows/build-openscience-pubpub.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: subtleazn
          password: ${{ secrets.ORG_MIRROR_TOKEN }}

      - name: Build and Push OpenScience PubPub Image
        uses: docker/build-push-action@v5
        with:
          context: ./containers/pubpub
          file: ./containers/pubpub/Dockerfile
          push: true
          tags: |
            ghcr.io/pinoyseoul/pubpub:openscience-v1.9
            ghcr.io/pinoyseoul/pubpub:openscience-v1.8
            ghcr.io/pinoyseoul/pubpub:openscience-v1.7
            ghcr.io/pinoyseoul/pubpub:openscience-v1.6
            ghcr.io/pinoyseoul/pubpub:openscience-v1.5
            ghcr.io/pinoyseoul/pubpub:openscience-v1.4
            ghcr.io/pinoyseoul/pubpub:openscience-v1.3
            ghcr.io/pinoyseoul/pubpub:openscience-v1.2
            ghcr.io/pinoyseoul/pubpub:openscience-v1.1
            ghcr.io/pinoyseoul/pubpub:openscience-v1.0
            ghcr.io/pinoyseoul/pubpub:openscience-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
